<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clauseium</title>
    <!--
      CSP for the task pane iframe. BUILT FROM ENV at compile time by
      webpack.config.js (buildCsp) — composed from APP_ORIGIN + SUPABASE_URL +
      the OAuth origins, with localhost added only in dev. Never hardcode hosts
      here: a prod build must not ship a localhost CSP that blocks the prod API.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="<%= htmlWebpackPlugin.options.csp %>"
    />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body class="bg-ink-950 text-ink-100">
    <div id="root"></div>
  </body>
</html>
