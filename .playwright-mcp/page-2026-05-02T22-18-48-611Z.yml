                            - paragraph: Acme Cloud Services Pvt Ltd · Mumbai · v2
                          - paragraph: "THIS MASTER SERVICES AGREEMENT (the \"Agreement\") is made and entered into as of the Effective Date by and between Acme Cloud Services Pvt Ltd, a company incorporated under the laws of India, and TechCo India Private Limited. The parties agree as follows:"
                          - generic:
                            - button
                            - paragraph:
                              - text: "14.2"
                              - generic: Limitation of Liability.
                              - button: Notwithstanding anything to the contrary, the aggregate liability of the Service Provider arising out of or in connection with this Agreement shall not exceed an amount equal to three (3) months of fees paid by the Customer in the twelve (12) months preceding the event giving rise to the claim.
                          - generic:
                            - button
                            - paragraph:
                              - text: "8.3"
                              - generic: Data Protection.
                              - button: The Service Provider shall implement reasonable security practices to protect Personal Data processed under this Agreement and shall comply with applicable data protection laws.
                          - generic:
                            - button
                            - paragraph:
                              - text: "12.1"
                              - generic: Indemnification.
                              - button: The Customer shall indemnify, defend and hold harmless the Service Provider from and against any and all third-party claims, damages, losses and expenses arising out of or in connection with the Customer's use of the Services.
                          - generic:
                            - button
                            - paragraph:
                              - text: "16.4"
                              - generic: Auto-renewal.
                              - button: This Agreement shall automatically renew for successive periods of one (1) year unless either Party provides written notice of non-renewal at least ninety (90) days prior to the expiration of the then-current term.
                          - generic:
                            - button
                            - paragraph:
                              - text: "21.1"
                              - generic: Governing Law.
                              - button: This Agreement shall be governed by and construed in accordance with the laws of India, without regard to its conflict of laws principles.
                          - generic:
                            - button
                            - paragraph:
                              - text: "21.2"
                              - generic: Arbitration.
                              - button: Any dispute arising out of this Agreement shall be referred to and finally resolved by arbitration administered by the Singapore International Arbitration Centre (SIAC) in accordance with the SIAC Rules then in force.
                          - generic:
                            - button
                            - paragraph:
                              - text: "9.1"
                              - generic: IP Assignment.
                              - button: All intellectual property rights in deliverables created by the Service Provider in the course of performing the Services shall be assigned to the Customer upon payment in full.
                          - generic:
                            - button
                            - paragraph:
                              - text: "11.3"
                              - generic: Non-compete.
                              - button: For a period of twenty-four (24) months following termination, the Customer shall not engage any competitor of the Service Provider for similar services within India.
                          - generic:
                            - button
                            - paragraph:
                              - text: "5.1"
                              - generic: Payment Terms.
                              - button: Customer shall pay all undisputed invoices within ninety (90) days of the invoice date.
                          - generic:
                            - button
                            - paragraph:
                              - text: "17.2"
                              - generic: Force Majeure.
                              - button: Neither Party shall be liable for delay or failure to perform due to causes beyond its reasonable control, including acts of God, war, and natural disasters.
                          - generic:
